name: s3-toolkit

x-php: &php
    image: s3-toolkit-php:dev
    build:
        context: .
        dockerfile: docker/php/Dockerfile
        target: dev
    volumes:
        - .:/var/www/html
    depends_on:
        mariadb:
            condition: service_healthy
        redis:
            condition: service_healthy
    restart: unless-stopped

services:
    app:
        <<: *php
        command: php artisan octane:start --server=roadrunner --host=0.0.0.0 --port=8000 --workers=2 --task-workers=0 --max-requests=500
        ports:
            - '${APP_PORT:-8090}:8000'
        mem_limit: 384m

    horizon:
        <<: *php
        command: php artisan horizon
        mem_limit: 256m

    vite:
        <<: *php
        command: npm run dev -- --host 0.0.0.0 --port 5174 --strictPort
        ports:
            - '${VITE_PORT:-5174}:5174'
        depends_on: []
        mem_limit: 512m
        profiles: [frontend]

    mariadb:
        image: mariadb:11.8
        command:
            - --innodb-buffer-pool-size=64M
            - --performance-schema=OFF
            - --max-connections=50
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        environment:
            MARIADB_DATABASE: ${DB_DATABASE:-s3_toolkit}
            MARIADB_USER: ${DB_USERNAME:-s3_toolkit}
            MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
        volumes:
            - mariadb:/var/lib/mysql
            - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
        ports:
            - '${DB_FORWARD_PORT:-3307}:3306'
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 5s
            timeout: 5s
            retries: 20
        mem_limit: 384m
        restart: unless-stopped

    redis:
        image: redis:7.4-alpine
        command: redis-server --maxmemory 48mb --maxmemory-policy noeviction --save "" --appendonly no
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 20
        mem_limit: 64m
        restart: unless-stopped

    minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
        volumes:
            - minio:/data
        ports:
            - '${MINIO_FORWARD_PORT:-9010}:9000'
            - '${MINIO_CONSOLE_FORWARD_PORT:-9011}:9001'
        mem_limit: 256m
        profiles: [s3]

volumes:
    mariadb:
    minio:
