<svg width="64" height="64" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>S3 Toolkit</title>
  <style>
    .tile { fill: #1a1a1a; }
    .glyph { fill: #fafafa; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #fafafa; }
      .glyph { fill: #1a1a1a; }
    }
  </style>
  <defs>
    <g id="wrench">
      <rect x="14.4" y="10" width="3.2" height="18" rx="1.6"/>
      <path d="M14.6 4.04V8.2H17.4V4.04A4.2 4.2 0 1 1 14.6 4.04Z"/>
    </g>
    <g id="screwdriver">
      <rect x="13.8" y="3" width="4.4" height="10" rx="1.8"/>
      <rect x="15.2" y="12" width="1.6" height="13"/>
      <path d="M15.2 24H16.8L16.6 28H15.4Z"/>
    </g>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <path d="M2 6L5.2 26.5C5.5 29 26.5 29 26.8 26.5L30 6Z" fill="white"/>
      <ellipse cx="16" cy="6" rx="14" ry="4.5" fill="white"/>
      <ellipse cx="16" cy="6" rx="11.6" ry="2.8" fill="black"/>
      <g transform="translate(16 18) rotate(45) scale(0.9) translate(-16 -16)">
        <use href="#wrench" fill="black" stroke="black" stroke-width="2.8" stroke-linejoin="round"/>
        <use href="#wrench" fill="white"/>
      </g>
      <g transform="translate(16 18) rotate(-45) scale(0.9) translate(-16 -16)">
        <use href="#screwdriver" fill="black" stroke="black" stroke-width="2.8" stroke-linejoin="round"/>
        <use href="#screwdriver" fill="white"/>
      </g>
    </mask>
  </defs>
  <rect class="tile" width="32" height="32" rx="7"/>
  <g transform="translate(16 16) scale(0.94) translate(-16 -15)">
    <rect class="glyph" width="32" height="32" mask="url(#cut)"/>
  </g>
</svg>
