memory_limit = 256M
; Файлы загружаются частями по 16 МБ (S3 multipart), лимиты с запасом на одну часть
post_max_size = 40M
upload_max_filesize = 32M
expose_php = Off
display_errors = Off
log_errors = On

opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

pcov.enabled = 0
